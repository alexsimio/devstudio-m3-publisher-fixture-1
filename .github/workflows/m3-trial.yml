# PROPOSED ARTIFACT (issue #141). NOT APPLIED to any repository and NOT AUTHORIZED.
# Lives under docs/, so it never runs in DevStudio's own CI. A future experiment would copy it to
# .github/workflows/m3-trial.yml in the disposable fixture repository, under a new registration
# revision that pins this file's blob as `trustedWorkflow.blob` and the callee's blob beside it.
#
# The trusted caller. Its only job calls one relative reusable workflow, which GitHub takes from
# the same commit as this file. For `pull_request`, that commit is GITHUB_SHA, the PR merge-branch
# commit. Jobs that call a reusable workflow cannot set `runs-on`, `steps` or `timeout-minutes`;
# the bound lives in the callee.
name: m3-trial

on:
  # Default activity types only (opened, synchronize, reopened). No `pull_request_target`,
  # `workflow_dispatch`, `schedule` or `push` trigger.
  pull_request:

# Read-only token for the whole run. The callee cannot raise it.
permissions:
  contents: read

jobs:
  m3-trial:
    # Relative, same-repository path: no owner, repository or `@ref`, so it cannot name another
    # repository or a mutable ref. No `with:` inputs and no `secrets:` (never `secrets: inherit`).
    uses: ./.github/workflows/m3-trial-check.yml
